name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upstream_image:
        description: Supported 9Router image to validate
        required: false
        default: decolua/9router:0.5.75
jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_IMAGE: ${{ inputs.upstream_image || 'decolua/9router:0.5.75' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: ./scripts/check-upstream-compatibility.sh
      - run: docker build --build-arg UPSTREAM_IMAGE="$UPSTREAM_IMAGE" -t 9router-auto-router:ci .
      - run: ./scripts/smoke-test.sh 9router-auto-router:ci
  latest-compatibility:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      UPSTREAM_IMAGE: decolua/9router:latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: ./scripts/check-upstream-compatibility.sh
