name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  resolve-upstream:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.upstream.outputs.digest }}
    steps:
      - id: upstream
        run: |
          set -eu
          docker buildx imagetools inspect decolua/9router:latest > upstream-inspect.txt
          digest=$(sed -n 's/^Digest:[[:space:]]*//p' upstream-inspect.txt | head -n1)
          test -n "$digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
  validate:
    needs: resolve-upstream
    uses: ./.github/workflows/validate-image.yml
    with:
      upstream_digest: ${{ needs.resolve-upstream.outputs.digest }}
      image_tag: 9router-auto-router:ci
