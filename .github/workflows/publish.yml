name: Validate and publish production image

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 9router-auto-router-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/skulldorom/9router-auto-router
  UPSTREAM_IMAGE: decolua/9router:latest

jobs:
  should-build:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decision.outputs.build }}
      upstream_digest: ${{ steps.upstream.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: upstream
        name: Resolve current upstream image digest
        run: |
          set -eu
          docker buildx imagetools inspect "$UPSTREAM_IMAGE" > upstream-inspect.txt
          digest=$(sed -n 's/^Digest:[[:space:]]*//p' upstream-inspect.txt | head -n1)
          test -n "$digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - id: decision
        name: Skip unchanged scheduled release
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_DIGEST: ${{ steps.upstream.outputs.digest }}
        run: |
          set -eu
          if [ "$EVENT_NAME" != schedule ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if docker pull "${IMAGE_NAME}:latest" >/dev/null 2>&1; then
            current_revision=$(docker image inspect "${IMAGE_NAME}:latest" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            current_upstream=$(docker image inspect "${IMAGE_NAME}:latest" --format '{{ index .Config.Labels "io.github.skulldorom.9router-auto-router.upstream.digest" }}')
            if [ "$current_revision" = "$GITHUB_SHA" ] && [ "$current_upstream" = "$UPSTREAM_DIGEST" ]; then
              echo 'build=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'build=true' >> "$GITHUB_OUTPUT"

  validate:
    needs: should-build
    if: needs.should-build.outputs.build == 'true'
    uses: ./.github/workflows/validate-image.yml
    with:
      upstream_digest: ${{ needs.should-build.outputs.upstream_digest }}
      image_tag: 9router-auto-router:validated
      upload_image: true

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-image
      - name: Load the tested image
        run: gzip --decompress --stdout validated-image.tar.gz | docker load
      - name: Refuse stale source or upstream validation
        id: current
        env:
          REVISION: ${{ needs.validate.outputs.revision }}
          VALIDATED_UPSTREAM_DIGEST: ${{ needs.validate.outputs.upstream_digest }}
        run: |
          set -eu
          current_revision=$(git ls-remote https://github.com/Skulldorom/9router-auto-router.git refs/heads/main | cut -f1)
          docker buildx imagetools inspect "$UPSTREAM_IMAGE" > upstream-inspect.txt
          current_upstream=$(sed -n 's/^Digest:[[:space:]]*//p' upstream-inspect.txt | head -n1)
          test -n "$current_upstream"
          if [ "$current_revision" != "$REVISION" ]; then
            echo "Validated ${REVISION}, but main is now ${current_revision}; a newer run owns latest."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          elif [ "$current_upstream" != "$VALIDATED_UPSTREAM_DIGEST" ]; then
            echo "Validated upstream ${VALIDATED_UPSTREAM_DIGEST}, but ${UPSTREAM_IMAGE} is now ${current_upstream}; skip latest until a new run validates it."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate to GHCR after validation
        if: steps.current.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable tags, then last-known-good latest
        if: steps.current.outputs.publish == 'true'
        env:
          REVISION: ${{ needs.validate.outputs.revision }}
          UPSTREAM_DIGEST: ${{ needs.validate.outputs.upstream_digest }}
          UPSTREAM_VERSION: ${{ needs.validate.outputs.upstream_version }}
        run: |
          set -eu
          short_revision=$(printf '%s' "$REVISION" | cut -c1-12)
          tags="sha-${REVISION} sha-${short_revision}"
          if [ "$UPSTREAM_VERSION" != unknown ]; then
            tags="$tags 9router-${UPSTREAM_VERSION}-sha-${REVISION} 9router-${UPSTREAM_VERSION}-sha-${short_revision}"
          fi
          for tag in $tags; do
            existing=$(docker buildx imagetools inspect "${IMAGE_NAME}:${tag}" 2>/dev/null || true)
            if [ -n "$existing" ]; then
              existing_revision=$(printf '%s\n' "$existing" | sed -n 's/^[[:space:]]*org.opencontainers.image.revision:[[:space:]]*//p' | head -n1)
              existing_upstream=$(printf '%s\n' "$existing" | sed -n 's/^[[:space:]]*io.github.skulldorom.9router-auto-router.upstream.digest:[[:space:]]*//p' | head -n1)
              if [ "$existing_revision" != "$REVISION" ] || [ "$existing_upstream" != "$UPSTREAM_DIGEST" ]; then
                echo "Immutable tag ${tag} already identifies a different image." >&2
                exit 1
              fi
            else
              docker tag 9router-auto-router:validated "${IMAGE_NAME}:${tag}"
              docker push "${IMAGE_NAME}:${tag}"
            fi
          done
          docker tag 9router-auto-router:validated "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"
      - name: Make the package public when repository settings permit
        if: steps.current.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          owner_type=$(gh api repos/Skulldorom/9router-auto-router --jq .owner.type)
          if [ "$owner_type" = Organization ]; then
            endpoint=/orgs/Skulldorom/packages/container/9router-auto-router
          else
            endpoint=/user/packages/container/9router-auto-router
          fi
          gh api --method PATCH "$endpoint" -f visibility=public || \
            echo "Package visibility was not changed; configure the GHCR package as public in GitHub settings."
